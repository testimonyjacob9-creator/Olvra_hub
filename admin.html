<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Olvra — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4efe8; --ink-dim:#c9bfae;
    --void-1:#160f22; --void-2:#241534; --void-3:#331b3f;
    --ember:#ff8c42; --ember-soft:#ffb578; --teal:#5eead4;
    --glass:rgba(244,239,232,0.06); --glass-border:rgba(244,239,232,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:linear-gradient(160deg, var(--void-1) 0%, var(--void-2) 55%, var(--void-3) 100%);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.8rem;
    margin-bottom:6px;
  }
  h1 span{color:var(--ember-soft);}
  .sub{color:var(--ink-dim); font-size:0.85rem; margin-bottom:28px;}

  .glass-panel{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:18px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  /* LOGIN */
  #loginScreen{max-width:360px; margin:80px auto 0;}
  #loginScreen .glass-panel{padding:32px 26px;}
  #loginScreen h2{font-family:'Fraunces', serif; font-weight:500; font-size:1.3rem; margin-bottom:18px;}
  input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    background:rgba(244,239,232,0.05);
    border:1px solid var(--glass-border);
    color:var(--ink);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  input::placeholder{color:var(--ink-dim);}
  input:focus{outline:none; border-color:var(--teal);}
  textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    background:rgba(244,239,232,0.05);
    border:1px solid var(--glass-border);
    color:var(--ink);
    border-radius:10px;
    padding:10px 12px;
    resize:vertical;
    min-height:44px;
  }
  textarea:focus{outline:none; border-color:var(--teal);}
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    background:linear-gradient(120deg, var(--ember), #ff6f3c);
    color:#1a0f0a;
  }
  .error-msg{color:#ff8080; font-size:0.8rem; margin-top:10px; display:none;}

  /* DASHBOARD */
  #dashboard{display:none;}
  .top-row{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;
  }
  #signOutBtn{background:var(--glass); border:1px solid var(--glass-border); color:var(--ink-dim);}

  .sys-row{
    padding:20px 22px;
    margin-bottom:14px;
  }
  .sys-row-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px;
  }
  .sys-row-head h3{font-family:'Fraunces', serif; font-weight:500; font-size:1.05rem;}
  .clicks{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    color:var(--teal);
    white-space:nowrap;
  }

  .toggle-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .switch{
    position:relative; width:42px; height:24px; flex-shrink:0;
  }
  .switch input{display:none; margin:0;}
  .slider{
    position:absolute; inset:0;
    background:rgba(244,239,232,0.15);
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s;
  }
  .slider::before{
    content:''; position:absolute; width:18px; height:18px; left:3px; top:3px;
    background:var(--ink); border-radius:50%; transition:transform 0.2s;
  }
  .switch input:checked + .slider{background:var(--teal);}
  .switch input:checked + .slider::before{transform:translateX(18px); background:var(--void-1);}
  .toggle-label{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em;}

  label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.66rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:5px;
    margin-top:10px;
  }
  .save-btn{
    margin-top:14px;
    background:var(--glass); border:1px solid var(--glass-border); color:var(--teal);
  }
  .save-btn:hover{border-color:var(--teal);}
  .save-status{font-size:0.7rem; color:var(--teal); margin-left:10px; opacity:0; transition:opacity 0.3s;}
  .save-status.show{opacity:1;}
</style>
</head>
<body>

<div class="wrap">

  <div id="loginScreen">
    <div class="glass-panel">
      <h2>olv<span style="color:var(--ember-soft)">ra</span> admin</h2>
      <input type="email" id="email" placeholder="Admin email" autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn">Sign in</button>
      <div class="error-msg" id="loginError">Wrong email or password.</div>
    </div>
  </div>

  <div id="dashboard">
    <div class="top-row">
      <div>
        <h1>Olvra <span>Admin</span></h1>
        <div class="sub">Toggle systems live, edit their message, track clicks.</div>
      </div>
      <button id="signOutBtn">Sign out</button>
    </div>

    <div id="rows"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCnKefzZS3pMGfaxIIjsRClkmWjR4xpEWQ",
    authDomain: "olvrahub.firebaseapp.com",
    projectId: "olvrahub",
    storageBucket: "olvrahub.firebasestorage.app",
    messagingSenderId: "821545082724",
    appId: "1:821545082724:web:f20fe7965bf3dd3fede471"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const SYSTEMS = [
    { id:'woodpay', name:'WoodPay', defaultUrl:'https://woodpay.netlify.app', defaultLive:true, defaultMsg:'' },
    { id:'cgpa', name:'Olvra CGPA', defaultUrl:'https://olvracgpa.netlify.app', defaultLive:true, defaultMsg:'' },
    { id:'snappull', name:'SnapPull', defaultUrl:'https://snappull.netlify.app', defaultLive:true, defaultMsg:'' },
    { id:'olvraboost', name:'Olvra Boost', defaultUrl:'https://olvraboost.netlify.app', defaultLive:true, defaultMsg:'' },
    { id:'webdev', name:'Web Development', defaultUrl:'https://wa.me/2347065702702', defaultLive:true, defaultMsg:'' },
    { id:'presence', name:'Presence', defaultUrl:'', defaultLive:false, defaultMsg:'' },
    { id:'voiceforge', name:'VoiceForge', defaultUrl:'', defaultLive:false, defaultMsg:'🎙️ Turn any text into a voice that sounds human.' },
    { id:'movie', name:'Movie & Streaming Finder', defaultUrl:'', defaultLive:false, defaultMsg:'🍿 Find what to watch before you finish deciding.' },
    { id:'linkbio', name:'Link-in-Bio Builder', defaultUrl:'', defaultLive:false, defaultMsg:'🔗 One link. Every place people can find you.' },
    { id:'qrcard', name:'QR & Business Card Generator', defaultUrl:'', defaultLive:false, defaultMsg:'📇 Your whole contact card, scanned in one tap.' },
    { id:'groupguard', name:'Group Management Bot', defaultUrl:'', defaultLive:false, defaultMsg:'🛡️ Groups that manage themselves while you sleep.' },
    { id:'apirelay', name:'API Wrapper', defaultUrl:'', defaultLive:false, defaultMsg:'🔌 Your own API, your own pricing, zero hassle.' },
    { id:'reminders', name:'Scheduled Reminders', defaultUrl:'', defaultLive:false, defaultMsg:'⏰ The nudge that shows up exactly when it should.' }
  ];

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const loginError = document.getElementById('loginError');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    loginError.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(e){
      loginError.textContent = 'Error: ' + e.code + ' — ' + e.message;
      loginError.style.display = 'block';
      console.error('Sign-in error:', e);
    }
  });

  document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if(user){
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      loadRows();
    } else {
      loginScreen.style.display = 'block';
      dashboard.style.display = 'none';
    }
  });

  async function loadRows(){
    const container = document.getElementById('rows');
    container.innerHTML = '';
    for (const sys of SYSTEMS){
      let state = { live: sys.defaultLive, url: sys.defaultUrl, message: sys.defaultMsg, clicks: 0 };
      try {
        const snap = await getDoc(doc(db, 'systems', sys.id));
        if(snap.exists()){
          const data = snap.data();
          state.live = data.live !== undefined ? data.live : state.live;
          state.url = data.url !== undefined ? data.url : state.url;
          state.message = data.message !== undefined ? data.message : state.message;
          state.clicks = data.clicks || 0;
        }
      } catch(e){ console.warn('Could not load', sys.id, e); }

      const row = document.createElement('div');
      row.className = 'glass-panel sys-row';
      row.innerHTML = `
        <div class="sys-row-head">
          <h3>${sys.name}</h3>
          <span class="clicks">${state.clicks} click${state.clicks === 1 ? '' : 's'}</span>
        </div>
        <div class="toggle-row">
          <label class="switch">
            <input type="checkbox" class="live-toggle" ${state.live ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
          <span class="toggle-label">${state.live ? 'Live' : 'Unavailable'}</span>
        </div>
        <label>App URL</label>
        <input type="text" class="url-input" value="${state.url || ''}" placeholder="https://...">
        <label>Message on card</label>
        <textarea class="msg-input" placeholder="Exciting one-liner shown on the card">${state.message || ''}</textarea>
        <button class="save-btn">Save</button>
        <span class="save-status">Saved ✓</span>
      `;

      const toggleInput = row.querySelector('.live-toggle');
      const toggleLabel = row.querySelector('.toggle-label');
      toggleInput.addEventListener('change', () => {
        toggleLabel.textContent = toggleInput.checked ? 'Live' : 'Unavailable';
      });

      row.querySelector('.save-btn').addEventListener('click', async () => {
        const live = toggleInput.checked;
        const url = row.querySelector('.url-input').value.trim();
        const message = row.querySelector('.msg-input').value.trim();
        await setDoc(doc(db, 'systems', sys.id), { live, url, message }, { merge: true });
        const statusEl = row.querySelector('.save-status');
        statusEl.classList.add('show');
        setTimeout(() => statusEl.classList.remove('show'), 1800);
      });

      container.appendChild(row);
    }
  }
</script>

</body>
</html>

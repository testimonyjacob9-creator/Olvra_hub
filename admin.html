<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Olvra — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4efe8; --ink-dim:#c9bfae;
    --void-1:#160f22; --void-2:#241534; --void-3:#331b3f;
    --ember:#ff8c42; --ember-soft:#ffb578; --teal:#5eead4;
    --glass:rgba(244,239,232,0.06); --glass-border:rgba(244,239,232,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:linear-gradient(160deg, var(--void-1) 0%, var(--void-2) 55%, var(--void-3) 100%);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.8rem;
    margin-bottom:6px;
  }
  h1 span{color:var(--ember-soft);}
  .sub{color:var(--ink-dim); font-size:0.85rem; margin-bottom:28px;}

  .glass-panel{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:18px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  /* LOGIN */
  #loginScreen{max-width:360px; margin:80px auto 0;}
  #loginScreen .glass-panel{padding:32px 26px;}
  #loginScreen h2{font-family:'Fraunces', serif; font-weight:500; font-size:1.3rem; margin-bottom:18px;}
  input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    background:rgba(244,239,232,0.05);
    border:1px solid var(--glass-border);
    color:var(--ink);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  input::placeholder{color:var(--ink-dim);}
  input:focus{outline:none; border-color:var(--teal);}
  textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    background:rgba(244,239,232,0.05);
    border:1px solid var(--glass-border);
    color:var(--ink);
    border-radius:10px;
    padding:10px 12px;
    resize:vertical;
    min-height:44px;
  }
  textarea:focus{outline:none; border-color:var(--teal);}
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    background:linear-gradient(120deg, var(--ember), #ff6f3c);
    color:#1a0f0a;
  }
  .error-msg{color:#ff8080; font-size:0.8rem; margin-top:10px; display:none;}

  /* DASHBOARD */
  #dashboard{display:none;}
  .top-row{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;
  }
  #signOutBtn{background:var(--glass); border:1px solid var(--glass-border); color:var(--ink-dim);}

  .sys-row{
    padding:20px 22px;
    margin-bottom:14px;
  }
  .sys-row-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px;
  }
  .sys-row-head h3{font-family:'Fraunces', serif; font-weight:500; font-size:1.05rem;}
  .clicks{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    color:var(--teal);
    white-space:nowrap;
  }

  .toggle-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .switch{
    position:relative; width:42px; height:24px; flex-shrink:0;
  }
  .switch input{display:none; margin:0;}
  .slider{
    position:absolute; inset:0;
    background:rgba(244,239,232,0.15);
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s;
  }
  .slider::before{
    content:''; position:absolute; width:18px; height:18px; left:3px; top:3px;
    background:var(--ink); border-radius:50%; transition:transform 0.2s;
  }
  .switch input:checked + .slider{background:var(--teal);}
  .switch input:checked + .slider::before{transform:translateX(18px); background:var(--void-1);}
  .toggle-label{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em;}

  label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.66rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:5px;
    margin-top:10px;
  }
  .save-btn{
    margin-top:14px;
    background:var(--glass); border:1px solid var(--glass-border); color:var(--teal);
  }
  .save-btn:hover{border-color:var(--teal);}
  .save-status{font-size:0.7rem; color:var(--teal); margin-left:10px; opacity:0; transition:opacity 0.3s;}
  .save-status.show{opacity:1;}

  /* STATS BAR */
  .stats-bar{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
    margin-bottom:22px;
  }
  .stat-card{padding:16px 14px; text-align:center;}
  .stat-value{
    font-family:'Fraunces', serif; font-weight:500; font-size:1.5rem; color:var(--teal);
  }
  .stat-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem;
    letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-dim);
    margin-top:4px;
  }

  /* TABS */
  .admin-tabs{display:flex; gap:8px; margin-bottom:20px;}
  .admin-tab{
    background:var(--glass); border:1px solid var(--glass-border); color:var(--ink-dim);
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
  }
  .admin-tab.active{color:var(--teal); border-color:var(--teal);}
  .admin-panel{display:none;}
  .admin-panel.active{display:block;}

  /* MESSAGES */
  .msg-row{padding:18px 20px; margin-bottom:12px;}
  .msg-row.unread{border-color:var(--teal);}
  .msg-row-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .msg-row-head strong{font-family:'Fraunces', serif; font-weight:500; font-size:0.98rem;}
  .msg-row-head a{color:var(--teal); font-size:0.78rem; text-decoration:none;}
  .msg-time{font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color:var(--ink-dim);}
  .msg-body{color:var(--ink-dim); font-size:0.88rem; line-height:1.6; margin-bottom:10px; white-space:pre-wrap;}
  .msg-read-toggle{
    background:none; border:1px solid var(--glass-border); color:var(--ink-dim);
    font-size:0.66rem; padding:7px 12px;
  }
  .msg-read-toggle.is-read{color:var(--ink-dim);}
  .empty-note{color:var(--ink-dim); font-size:0.85rem; padding:20px 4px;}
</style>
</head>
<body>

<div class="wrap">

  <div id="loginScreen">
    <div class="glass-panel">
      <h2>olv<span style="color:var(--ember-soft)">ra</span> admin</h2>
      <input type="email" id="email" placeholder="Admin email" autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn">Sign in</button>
      <div class="error-msg" id="loginError">Wrong email or password.</div>
    </div>
  </div>

  <div id="dashboard">
    <div class="top-row">
      <div>
        <h1>Olvra <span>Admin</span></h1>
        <div class="sub">Toggle systems live, edit their message, track clicks and messages.</div>
      </div>
      <button id="signOutBtn">Sign out</button>
    </div>

    <div class="stats-bar">
      <div class="glass-panel stat-card">
        <div class="stat-value" id="statClicks">—</div>
        <div class="stat-label">Total clicks</div>
      </div>
      <div class="glass-panel stat-card">
        <div class="stat-value" id="statTopSystem">—</div>
        <div class="stat-label">Most clicked</div>
      </div>
      <div class="glass-panel stat-card">
        <div class="stat-value" id="statViews">—</div>
        <div class="stat-label">Total page views</div>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="systems">Systems</button>
      <button class="admin-tab" data-tab="messages">Messages <span id="unreadBadge"></span></button>
    </div>

    <div class="admin-panel active" id="panel-systems">
      <div id="rows"></div>
    </div>

    <div class="admin-panel" id="panel-messages">
      <div id="messagesList"></div>
    </div>

  </div>

</div>

<script type="module">
  import { app, db } from '/firebase-init.js';
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, setDoc, collection, getDocs, query, orderBy, updateDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { SYSTEMS_META } from '/systems-data.js';

  const auth = getAuth(app);
  const SYSTEMS = SYSTEMS_META;

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const loginError = document.getElementById('loginError');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    loginError.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(e){
      loginError.textContent = 'Error: ' + e.code + ' — ' + e.message;
      loginError.style.display = 'block';
      console.error('Sign-in error:', e);
    }
  });

  document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if(user){
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      loadRows();
      loadMessages();
      loadPageviews();
    } else {
      loginScreen.style.display = 'block';
      dashboard.style.display = 'none';
    }
  });

  // --- Tabs ---
  document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  // --- Systems + click stats ---
  async function loadRows(){
    const container = document.getElementById('rows');
    container.innerHTML = '';
    let totalClicks = 0;
    let topSystem = { name: '—', clicks: -1 };

    for (const sys of SYSTEMS){
      let state = { live: sys.defaultLive, url: sys.defaultUrl, message: sys.defaultMsg, clicks: 0 };
      try {
        const snap = await getDoc(doc(db, 'systems', sys.id));
        if(snap.exists()){
          const data = snap.data();
          state.live = data.live !== undefined ? data.live : state.live;
          state.url = data.url !== undefined ? data.url : state.url;
          state.message = data.message !== undefined ? data.message : state.message;
          state.clicks = data.clicks || 0;
        }
      } catch(e){ console.warn('Could not load', sys.id, e); }

      totalClicks += state.clicks;
      if(state.clicks > topSystem.clicks){
        topSystem = { name: sys.name, clicks: state.clicks };
      }

      const row = document.createElement('div');
      row.className = 'glass-panel sys-row';
      row.innerHTML = `
        <div class="sys-row-head">
          <h3>${sys.name}</h3>
          <span class="clicks">${state.clicks} click${state.clicks === 1 ? '' : 's'}</span>
        </div>
        <div class="toggle-row">
          <label class="switch">
            <input type="checkbox" class="live-toggle" ${state.live ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
          <span class="toggle-label">${state.live ? 'Live' : 'Unavailable'}</span>
        </div>
        <label>App URL</label>
        <input type="text" class="url-input" value="${state.url || ''}" placeholder="https://...">
        <label>Message on card</label>
        <textarea class="msg-input" placeholder="Exciting one-liner shown on the card">${state.message || ''}</textarea>
        <button class="save-btn">Save</button>
        <span class="save-status">Saved ✓</span>
      `;

      const toggleInput = row.querySelector('.live-toggle');
      const toggleLabel = row.querySelector('.toggle-label');
      toggleInput.addEventListener('change', () => {
        toggleLabel.textContent = toggleInput.checked ? 'Live' : 'Unavailable';
      });

      row.querySelector('.save-btn').addEventListener('click', async () => {
        const live = toggleInput.checked;
        const url = row.querySelector('.url-input').value.trim();
        const message = row.querySelector('.msg-input').value.trim();
        await setDoc(doc(db, 'systems', sys.id), { live, url, message }, { merge: true });
        const statusEl = row.querySelector('.save-status');
        statusEl.classList.add('show');
        setTimeout(() => statusEl.classList.remove('show'), 1800);
      });

      container.appendChild(row);
    }

    document.getElementById('statClicks').textContent = totalClicks;
    document.getElementById('statTopSystem').textContent = topSystem.clicks > 0 ? topSystem.name : '—';
  }

  // --- Page view totals (from /analytics.js writes) ---
  async function loadPageviews(){
    try {
      const snap = await getDocs(collection(db, 'pageviews'));
      let total = 0;
      snap.forEach(d => { total += (d.data().views || 0); });
      document.getElementById('statViews').textContent = total;
    } catch(e){
      console.warn('Could not load pageviews', e);
      document.getElementById('statViews').textContent = '—';
    }
  }

  // --- Contact form messages ---
  async function loadMessages(){
    const list = document.getElementById('messagesList');
    const badge = document.getElementById('unreadBadge');
    list.innerHTML = '';
    try {
      const q = query(collection(db, 'messages'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      if(snap.empty){
        list.innerHTML = '<div class="empty-note">No messages yet.</div>';
        badge.textContent = '';
        return;
      }
      let unread = 0;
      snap.forEach(d => {
        const m = d.data();
        if(!m.read) unread++;
        const when = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate().toLocaleString() : '';
        const row = document.createElement('div');
        row.className = 'glass-panel msg-row' + (m.read ? '' : ' unread');
        row.innerHTML = `
          <div class="msg-row-head">
            <div><strong>${m.name || 'Unknown'}</strong> — <a href="mailto:${m.email || ''}">${m.email || ''}</a></div>
            <span class="msg-time">${when}</span>
          </div>
          <div class="msg-body">${m.message || ''}</div>
          <button class="msg-read-toggle ${m.read ? 'is-read' : ''}">${m.read ? 'Mark unread' : 'Mark read'}</button>
        `;
        row.querySelector('.msg-read-toggle').addEventListener('click', async () => {
          const newRead = !m.read;
          await updateDoc(doc(db, 'messages', d.id), { read: newRead });
          loadMessages();
        });
        list.appendChild(row);
      });
      badge.textContent = unread > 0 ? `(${unread})` : '';
    } catch(e){
      console.warn('Could not load messages', e);
      list.innerHTML = '<div class="empty-note">Could not load messages.</div>';
    }
  }
</script>

</body>
</html>
